    <script>
        // Capturador de Erros Precoce (Anti-Tela-Branca)
        window.onerror = function (msg, url, line, col, error) {
            console.error('[Early Error]', msg, error);
            const app = document.getElementById('app');
            if (app && !window.initialized) {
                app.innerHTML = `
                    <div style="padding: 40px; text-align: center; color: white; background: #181818; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: sans-serif;">
                        <span style="font-size: 48px; margin-bottom: 20px;">!</span>
                        <h2 style="margin-bottom: 10px;">Falha ao Iniciar App</h2>
                        <p style="color: #888; font-size: 0.9rem; margin-bottom: 30px; max-width: 300px;">${msg}</p>
                        <button onclick="location.reload()" style="background: #E30613; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer;">RECARREGAR</button>
                    </div>
                `;
            }
        };
    </script>

    <!-- FALLBACK VISUAL (ANTI-TELA-BRANCA) -->
    <style>
        :root {
            --bg: #181818;
            --primary: #E30613;
            --surface: #242424;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            font-family: 'PT Sans Narrow', 'Arial Narrow', Arial, sans-serif;
            color: white;
            overflow-x: hidden;
        }

        #app {
            height: 100%;
            width: 100%;
            position: relative;
        }

        .splash-preloader {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            min-height: 100vh;
            background: #030504;
            animation: fadeIn 0.5s ease-out;
        }

        .splash-loading-label {
            color: #a7f3d0;
            font: 700 13px/1 Arial, sans-serif;
            letter-spacing: .55em;
            text-indent: .55em;
        }

        .splash-loading-dots {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .splash-loading-dots span {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: hsl(calc(var(--i) * 21deg + 145deg) 85% 55%);
            box-shadow: 0 0 12px currentColor;
            animation: splashDot 1.35s ease-in-out infinite;
            animation-delay: calc(var(--i) * 65ms);
        }

        @keyframes splashDot {
            0%, 55%, 100% { opacity: .22; transform: scale(.72); }
            25% { opacity: 1; transform: scale(1.18); }
        }


        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* Garantir que o app shell suma quando o JS assumir */
        #app.loaded .splash-preloader {
            display: none;
        }
    </style>
